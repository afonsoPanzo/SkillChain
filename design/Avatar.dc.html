<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display:block">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="{{ bg }}"></rect>
  <path d="M18 100 C18 75 33 67 50 67 C67 67 82 75 82 100 Z" fill="{{ bodyDark }}"></path>
  <circle cx="50" cy="45" r="21" fill="{{ body }}"></circle>
  <rect x="40" y="40" width="5" height="9" rx="2.5" fill="#0E0F14"></rect>
  <rect x="55" y="40" width="5" height="9" rx="2.5" fill="#0E0F14"></rect>
  <g opacity="{{ accOp }}">
    <rect x="25" y="41" width="50" height="4" rx="2" fill="#0E0F14"></rect>
    <rect x="33" y="36" width="15" height="13" rx="4" fill="#14F195" stroke="#0E0F14" stroke-width="3"></rect>
    <rect x="52" y="36" width="15" height="13" rx="4" fill="#14F195" stroke="#0E0F14" stroke-width="3"></rect>
  </g>
  <g opacity="{{ f0Op }}">
    <rect x="3" y="3" width="94" height="94" rx="20" fill="none" stroke="#14F195" stroke-width="4" stroke-dasharray="9 6"></rect>
  </g>
  <g opacity="{{ f1Op }}">
    <rect x="2.5" y="2.5" width="95" height="95" rx="21" fill="none" stroke="#A15CFF" stroke-width="3.5"></rect>
    <rect x="8.5" y="8.5" width="83" height="83" rx="15" fill="none" stroke="#A15CFF" stroke-width="1.5"></rect>
    <rect x="45" y="-1" width="10" height="10" transform="rotate(45 50 4)" fill="#A15CFF"></rect>
    <rect x="45" y="91" width="10" height="10" transform="rotate(45 50 96)" fill="#A15CFF"></rect>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;hue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:360,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[255,0,1],&quot;default&quot;:255,&quot;tsType&quot;:&quot;number&quot;},&quot;accessory&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = this.props.hue ?? 200;
    const f = this.props.frame ?? 255;
    return {
      bg: `hsl(${h} 42% 30%)`,
      body: `hsl(${h} 55% 66%)`,
      bodyDark: `hsl(${h} 45% 18%)`,
      accOp: this.props.accessory ? 1 : 0,
      f0Op: f === 0 ? 1 : 0,
      f1Op: f === 1 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
